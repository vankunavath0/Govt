name: Daily Govt Job Scraper

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST daily
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper Cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: "Asia/Kolkata"
        run: python -c "from main import job_execution_cycle; job_execution_cycle()"

      - name: Commit and Push Updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if jobs.db was created or modified
          if [ -n "$(git status --porcelain jobs.db)" ]; then
            git add jobs.db
            git commit -m "chore: update seen jobs database [skip ci]"
            git pull origin main --rebase
            git push origin main
          else
            echo "No database changes to commit."
          fi